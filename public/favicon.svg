<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="N3xUs">
  <defs>
    <radialGradient id="nebula" cx="78%" cy="16%" r="75%">
      <stop offset="0%" stop-color="#7f9a8c" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#2b3f34" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090a0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="12%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#3d5a4c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090a0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nfill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f6f4"/>
      <stop offset="55%" stop-color="#eceeeb"/>
      <stop offset="100%" stop-color="#c9d4cb"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="#090a0b"/>
  <rect width="512" height="512" rx="112" fill="url(#nebula)"/>
  <rect width="512" height="512" rx="112" fill="url(#nebula2)"/>

  <!-- stars -->
  <g fill="#eceeeb">
    <circle cx="92" cy="86" r="3.2" opacity="0.9"/>
    <circle cx="150" cy="52" r="2" opacity="0.55"/>
    <circle cx="212" cy="96" r="2.6" opacity="0.7"/>
    <circle cx="298" cy="58" r="2" opacity="0.5"/>
    <circle cx="368" cy="120" r="2.8" opacity="0.65"/>
    <circle cx="430" cy="200" r="2" opacity="0.5"/>
    <circle cx="448" cy="330" r="2.6" opacity="0.6"/>
    <circle cx="392" cy="428" r="2" opacity="0.45"/>
    <circle cx="300" cy="452" r="2.8" opacity="0.6"/>
    <circle cx="180" cy="432" r="2" opacity="0.5"/>
    <circle cx="84" cy="352" r="2.6" opacity="0.6"/>
    <circle cx="58" cy="220" r="2" opacity="0.45"/>
    <circle cx="120" cy="180" r="1.8" opacity="0.4"/>
    <circle cx="332" cy="180" r="1.8" opacity="0.4"/>
    <circle cx="250" cy="330" r="1.6" opacity="0.35"/>
  </g>

  <!-- the N, scaled from the brand mark -->
  <g transform="translate(-64,-64) scale(20)" filter="url(#glow)">
    <path fill="url(#nfill)" d="M7 25V7h5.5L20 18.2V7h5v18h-5.5L12 13.8V25H7z"/>
  </g>

  <!-- spark on the N -->
  <g filter="url(#starglow)">
    <path fill="#7f9a8c" d="M438 62 L448 96 L482 106 L448 116 L438 150 L428 116 L394 106 L428 96 Z"/>
    <circle cx="438" cy="106" r="7" fill="#d7e0d8"/>
  </g>

  <!-- inner edge -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#eceeeb" stroke-opacity="0.10" stroke-width="3"/>
</svg>
